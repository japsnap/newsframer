# モデル設定 — ここを変えるだけで全エージェントのモデルが切り替わる

fetcher_model: "gemini/gemini-2.5-flash-lite"
analyst_model: "gemini/gemini-2.5-flash-lite"
writer_model: "anthropic/claude-sonnet-4-6"
classifier_model: "gemini/gemini-2.5-flash-lite"

# 切り替え例:
# writer_model: "anthropic/claude-opus-4-6"
# writer_model: "openai/gpt-4o"

# Claude APIが使えない時のフォールバック:
# analyst_model: "gemini/gemini-2.5-flash"
# writer_model: "gemini/gemini-2.5-pro"

# Fetcherの設定
fetch_hours_back: 24
first_run_hours_back: 48
max_articles_per_source: 10
max_articles_total: 250   # SUPERSEDED: order-based truncation removed (it starved later/newer sources). Kept for reference only; not read by the fetcher.
fetch_safety_ceiling: 600  # No truncation under normal load. Only if a run exceeds this (typical peak ~200 articles x 3) do we cut — and then RANDOMLY across all articles, never by source order. Runaway-bug guard.

# Priority
priority_source_types: ["vc_blog", "research", "blog"]
priority_guaranteed: true  # 優先ソースは150件制限の外（fetcher.pyにハードコード済み）

# --- Pricing per 1M tokens, USD ---
# Update when swapping models or when provider prices change.
# Used by every agent via estimate_cost(config, model, tokens_in, tokens_out).
# Verified May 2026.
pricing:
  "gemini/gemini-2.5-flash-lite":
    input: 0.10
    output: 0.40
  "anthropic/claude-haiku-4-5":
    input: 1.00
    output: 5.00
  # Populate as each agent comes online:
  # "anthropic/claude-sonnet-4-6": { input: ?, output: ? }
  # "gemini/gemini-2.5-flash":     { input: 0.30, output: 2.50 }   # Claude fallback
  # "gemini/gemini-2.5-pro":       { input: ?,    output: ? }      # Claude fallback

analyst_max_articles_per_run: 300
analyst_window_hours: 30

# Writer settings
writer_model: "anthropic/claude-haiku-4-5"
writer_fallback_model: "gemini/gemini-2.5-flash-lite"   # Fix 3: degrade to Gemini if Anthropic errors/rate-limits/billing-fails
writer_primary_language: "en"
writer_min_relevance: 6
writer_relevance_floor: 4              # §4.5: backoff may lower the threshold down to here, within the 24h window
writer_max_themes: 5
writer_min_themes: 3
writer_max_articles_per_theme: 6
writer_window_hours: 24                # §4.5: 24h day-window (reduced from 30 to avoid overlap)
writer_delivery_account: "newsframer"  # §4.3: exclude article IDs already delivered to this account
writer_max_chars: 8500                  # superseded by per-theme scaling below (Fix 2); kept for reference
writer_per_theme_chars: 2500            # Fix 2: char budget per theme
writer_max_chars_floor: 6000            # Fix 2: cap never below this
writer_max_chars_ceiling: 16000         # Fix 2: cap never above this
writer_highlights_count: 8         # target number of highlights
writer_highlights_min_relevance: 8 # only rel >= 8 articles become highlights

# Drop-reports (spec §8.5, basic version — Telegram-self only)
drop_report_window_hours: 168      # 7-day deduped window for investigative drops (explicit exception to the §4.5 24h selection rule)
drop_report_max: 3                 # max drops per brief; logs overflow (no silent cap)
drop_report_model: "gemini/gemini-2.5-flash-lite"  # cheap model for the short+long drop summaries

# Deduplicator settings
deduplicator_embedding_model: "gemini/gemini-embedding-001"
deduplicator_embedding_dimensions: 768
deduplicator_similarity_threshold: 0.85
deduplicator_window_hours: 48
deduplicator_price_event_window_hours: 12
deduplicator_high_similarity_threshold: 0.90

# Dispatcher settings
dispatcher_telegram_msg_limit: 3500
dispatcher_target_language: "en"
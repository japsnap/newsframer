# モデル設定 — ここを変えるだけで全エージェントのモデルが切り替わる

fetcher_model: "gemini/gemini-2.5-flash-lite"
analyst_model: "gemini/gemini-2.5-flash-lite"
writer_model: "anthropic/claude-sonnet-4-6"
classifier_model: "gemini/gemini-2.5-flash-lite"

# 切り替え例:
# writer_model: "anthropic/claude-opus-4-6"
# writer_model: "openai/gpt-4o"

# Claude APIが使えない時のフォールバック:
# analyst_model: "gemini/gemini-2.5-flash"
# writer_model: "gemini/gemini-2.5-pro"

# Fetcherの設定
fetch_hours_back: 24
first_run_hours_back: 48
max_articles_per_source: 100   # 2026-06-15 (operator): raised 10 -> 100. The fetch is "newest-first"
                               #   (top of each RSS feed, within fetch_hours_back); a small cap + one
                               #   daily poll dropped earlier-in-the-day stories from busy sources.
                               #   100 effectively takes the full 24h each feed exposes. This is the
                               #   GLOBAL/basic setting; a future "light mode" (cap ~10, most-recent
                               #   only) is backlogged as a switchable profile.
max_articles_total: 250   # SUPERSEDED: order-based truncation removed (it starved later/newer sources). Kept for reference only; not read by the fetcher.
fetch_safety_ceiling: 3000  # 2026-06-15: raised 600 -> 3000 to match the 100/source cap (43 producing
                            #   sources x up to 100). Pure runaway guard: only if a run exceeds this do we
                            #   cut, and then RANDOMLY across all articles (never by source order). 3000
                            #   caps a tens-of-thousands runaway without throwing away normal-load context.

# Priority
priority_source_types: ["vc_blog", "research", "blog"]
priority_guaranteed: true  # 優先ソースは150件制限の外（fetcher.pyにハードコード済み）

# --- Pricing per 1M tokens, USD ---
# Update when swapping models or when provider prices change.
# Used by every agent via estimate_cost(config, model, tokens_in, tokens_out).
# Verified May 2026.
pricing:
  "gemini/gemini-2.5-flash-lite":
    input: 0.10
    output: 0.40
  "anthropic/claude-haiku-4-5":
    input: 1.00
    output: 5.00
  # Populate as each agent comes online:
  # "anthropic/claude-sonnet-4-6": { input: ?, output: ? }
  # "gemini/gemini-2.5-flash":     { input: 0.30, output: 2.50 }   # Claude fallback
  # "gemini/gemini-2.5-pro":       { input: ?,    output: ? }      # Claude fallback

analyst_max_articles_per_run: 3000   # 2026-06-15: raised 300 -> 3000 to match the fetch ceiling, so the
                                     #   bigger 100/source fetch is actually scored (the analyst loads
                                     #   unscored newest-first; at 300 it silently dropped everything past
                                     #   the 300 newest -> absent from the brief). A ceiling, not a target:
                                     #   real cost tracks ACTUAL volume (cheap Gemini Flash-Lite per article).
analyst_window_hours: 30

# NF-C2: second-slot freshness — the 11:00 WhatsApp brief used to reuse the 06:00 data
# (nothing is fetched between slots), so it was never fresher than the morning. These make
# the 11:00 run gap-fetch the new content first, then weight fresh items so they surface.
whatsapp_gap_refresh: true     # at the 11:00 slot, refresh the pool (fetch->classify->dedup->analyst
                               #   on the gap since 06:00) BEFORE building, so the WhatsApp brief sees
                               #   06:00-11:00 news. false = old behaviour (no intraday fetch). --send only.
whatsapp_fresh_hours: 6        # an article published within this many hours counts as "fresh" and
                               #   qualifies at the relevance FLOOR (not the higher day threshold), so a
                               #   genuinely new story surfaces even if borderline (NF-C2 weight-fresh-higher).

# Writer settings
writer_model: "anthropic/claude-haiku-4-5"
writer_fallback_model: "gemini/gemini-2.5-flash-lite"   # Fix 3: degrade to Gemini if Anthropic errors/rate-limits/billing-fails
writer_primary_language: "en"
writer_min_relevance: 6
writer_relevance_floor: 4              # §4.5: backoff may lower the threshold down to here, within the 24h window
writer_max_themes: 5
writer_min_themes: 3
writer_max_articles_per_theme: 6
writer_window_hours: 24                # §4.5: 24h day-window (reduced from 30 to avoid overlap)
writer_delivery_account: "newsframer"  # §4.3: exclude article IDs already delivered to this account
writer_max_chars: 8500                  # superseded by per-theme scaling below (Fix 2); kept for reference
writer_per_theme_chars: 2500            # Fix 2: char budget per theme
writer_max_chars_floor: 6000            # Fix 2: cap never below this
writer_max_chars_ceiling: 16000         # Fix 2: cap never above this
writer_char_overrun_warn_ratio: 1.0     # NF-F2: flag a brief in the run log when chars > cap x this (1.0 = any overrun; 1.15 = only >15% over)
writer_highlights_count: 8         # target number of highlights
writer_highlights_min_relevance: 8 # only rel >= 8 articles become highlights

# Drop-reports (spec §8.5, basic version — Telegram-self only)
drop_report_window_hours: 168      # 7-day deduped window for investigative drops (explicit exception to the §4.5 24h selection rule)
drop_report_max: 3                 # max drops per brief; logs overflow (no silent cap)
drop_report_max_per_source: 1      # NF-NEW3: max drops from any ONE source per brief, so a high-volume
                                   #   investigative source can't take every Investigations slot
drop_report_model: "gemini/gemini-2.5-flash-lite"  # cheap model for the short+long drop summaries

# Per-bundle theme floors (spec §8.1/§8.6) — Telegram brief only. Guarantees each ACTIVE bundle
# (a source category with >=1 qualifying in-window article) a minimum presence in the OUTPUT, so a
# high-volume bundle (crypto) can't crowd out a low-frequency one (cybersecurity). A bundle with
# nothing qualifying is simply absent (no stale padding, §4.5). NOTE: writer_max_themes above now
# governs the WhatsApp briefs only; the Telegram theme count is the dynamic target below.
bundle_theme_floors:               # guaranteed minimum themes per active bundle (a bundle with no
  crypto: 1                        #   qualifying in-window article is simply absent — never padded)
  geopolitics: 1
  pakistan: 1
  cybersecurity: 1
  tech: 1
  vc: 1                            # NF-A1: VC split out of tech into its own bundle (own theme floor)
bundle_theme_cap: 2                # max themes any single bundle may take (covers 2 big stories, never monopolizes)
theme_count_multiplier: 1.5        # total Telegram themes = ceil(multiplier * #active bundles); 6 bundles -> 9
theme_count_max: 14                # absolute safety ceiling on total themes (headroom as bundles grow: vc now,
                                   #   football/etc. later — the multiplier above does the scaling; this only caps runaway)

# ============================================================================
# Tunables — NOTHING below is hard-coded in code; every value here is read with
# config.get(<key>, <this default>). Defaults reproduce the current behaviour, so
# changing your topic set / scale only means editing this file. Anyone reusing this
# repo tunes here, not in the source or the prompt files.
# ============================================================================

# --- LLM call parameters (per agent) ---
writer_temperature: 0.3
writer_max_tokens: 4500
classifier_temperature: 0.2
analyst_temperature: 0.2
drop_report_temperature: 0.2
drop_report_max_tokens: 900
whatsapp_temperature: 0.3
whatsapp_max_tokens: 4500
whatsapp_translate_temperature: 0.2
whatsapp_translate_max_tokens: 6000

# --- Content snippet lengths fed to the LLM (characters) ---
classifier_content_snippet_chars: 500
analyst_content_snippet_chars: 1500
writer_theme_snippet_chars: 600
writer_highlight_snippet_chars: 400
drop_report_content_chars: 3000

# --- Batch / retry / output-truncation ---
classifier_batch_size: 10
analyst_max_retries: 3
analyst_retry_backoff_seconds: 2
analyst_reasoning_max_chars: 500
analyst_differentiator_max_chars: 300
drop_report_short_max_chars: 400
drop_report_long_max_chars: 2000

# --- Deduplicator text lengths (characters) ---
deduplicator_embed_text_chars: 500
deduplicator_price_event_text_chars: 300

# --- World Cup (NF-A3, temporary — data from Wikipedia, not an API) ---
worldcup_end_date: "2026-07-19"        # after this the WC message self-skips (no empty sends)
worldcup_result_window_hours: 24       # results = FINISHED matches that kicked off in the last N hours —
                                       #   a TRUE rolling window by real kickoff time, NOT a venue-date cut
                                       #   (WC venues are in the US/behind UTC, so a venue date lags real time)
worldcup_fixture_window_hours: 24      # fixtures = matches kicking off within the next N hours (rolling)
worldcup_display_tz: "Asia/Karachi"    # label for the "Next 24 hours" kickoff times (Pakistan time)
worldcup_display_utc_offset_hours: 5   # offset used to CONVERT kickoffs (this Windows host has no IANA
                                       #   tzdata, so zoneinfo can't resolve the name; Pakistan has no
                                       #   DST, so a fixed +5 is exact). Change both if the audience moves.
worldcup_display_tz_label: "PKT / UTC+5"  # shown once in the fixtures header so readers know the zone
worldcup_reply_line: "Any questions, reply"  # closing invite; "" disables it. Reply HANDLING is NOT built
                                       #   yet — replies are only received (no auto-response). See run_worldcup_brief.
# Which WhatsApp registry chats receive the WC brief: every delivery EXCEPT those with `worldcup: false`
# in config/whatsapp_deliveries.yaml (gitignored). Targets/JIDs/numbers stay in that registry, never here.

# --- Delivery ---
telegram_message_limit: 3800       # per-message char cap (Telegram hard cap is 4096)
deliver_wait_seconds: 240          # no-delivery fix (2026-06-14): deliver_brief waits up to this long
deliver_poll_seconds: 15           #   for today's fresh brief before giving up (covers a build that
                                   #   finishes just after deliver starts). 0 = old no-wait behaviour.

# --- Run-health watchdog: slot start hours (JST; keep in step with the cron schedules) ---
slot_hours:
  telegram: 6
  whatsapp: 11

# Deduplicator settings
deduplicator_embedding_model: "gemini/gemini-embedding-001"
deduplicator_embedding_dimensions: 768
deduplicator_similarity_threshold: 0.85
deduplicator_window_hours: 48
deduplicator_price_event_window_hours: 12
deduplicator_high_similarity_threshold: 0.90

# --- Title-dedup (NF-NEW10): collapse same-story wire pile-ups BEFORE the analyst ---
# Reuses the deduplicator's clusters (cluster_id); for each still-alive multi-member
# cluster, a cheap titles-only LLM confirms "one event?" and on yes soft-deletes all but
# the originator, so the analyst scores one copy per story. Soft-delete only (audit trail
# intact). agents/title_dedup.py is DRY by default; --apply collapses.
title_dedup_enabled: false             # wiring gate: false = NOT in the live pipeline yet (run by hand).
                                       #   Flip to true only after wiring it before the analyst stage.
title_dedup_model: "gemini/gemini-2.5-flash-lite"   # titles-only confirm; cheapest model
title_dedup_window_hours: 48           # match the deduplicator window (cluster_id is set there)
title_dedup_only_unscored: true        # only collapse copies the analyst has NOT scored yet (pre-paid stage)
title_dedup_temperature: 0             # deterministic yes/no
title_dedup_max_tokens: 20             # the reply is just {"same_event": true|false}

# Dispatcher settings
dispatcher_telegram_msg_limit: 3500
dispatcher_target_language: "en"
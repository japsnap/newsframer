# NewsFramer sources: the feeds your brief is built from. Copy to config/sources.yaml and edit;
# `python manage.py sync` writes them into the database (adds new names, updates existing ones,
# never deletes: set active: false to stop a source).
#
# Fields: name (unique key), category (the topic bundle; any text, e.g. science), weight (0..1,
# editorial weight), source_type (news | blog | research), has_rss + rss_url (the feed), site_url,
# language, fetch_mode (rss | browser_required for sites without a feed), fetch_window_hours,
# scrape_days (e.g. "wed,sat" for sources fetched only on those days), region,
# groundnews_publication_bias (left | center | right), groundnews_factuality, active.

sources:

